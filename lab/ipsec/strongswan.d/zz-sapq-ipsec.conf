# Drop-in do charon para o SAPQ-IPsec. Instalar em /etc/strongswan.d/
# (o /etc/strongswan.conf termina com `include strongswan.d/*.conf`; o
# prefixo zz- garante que vem depois dos outros includes).
#
#   sudo cp lab/ipsec/strongswan.d/zz-sapq-ipsec.conf /etc/strongswan.d/
#   sudo bash ~/oai-lab-conf/stop-all-ipsec.sh && sudo bash ~/oai-lab-conf/start-all-ipsec.sh
#
# POR QUE ESTE ARQUIVO EXISTE, mesmo sendo `yes` o default do
# strongSwan 6.0.4: a Fase A mediu que esta opção é REQUISITO da
# proposta, não afinação, e depender de um default é frágil demais para
# isso.
#
# `make_before_break` governa a REAUTENTICAÇÃO IKEv2 — o rekey de Child
# SA é sempre make-before-break por imposição da RFC 7296. Como o PPK
# entra na derivação no IKE_AUTH, renovar PPK EXIGE reauth, então esta
# opção incide exatamente sobre o mecanismo central do SAPQ-IPsec.
#
# Interrupção medida na A.2 (400 eventos, dois sentidos, p50):
#
#   RTT do enlace   com `yes`              sem (`no`)
#   0,04 ms         0 ida / 1,7 ms volta   3,2-3,8 ms nos dois sentidos
#   10,1 ms         0 ida / 1,8 ms volta   43,5 ms ida
#   40,1 ms         0 ida / 1,8 ms volta   163,7 ms ida
#
# A componente de ida sem a opção vale exatamente 4 round-trips e por
# isso escala com o RTT. Num backhaul de 20 ms por sentido, deixar em
# `no` custaria 163 ms de interrupção A CADA renovação de PPK —
# inviável para a URLLC. Com `yes` sobram ~1,8 ms num sentido só.
charon {
    make_before_break = yes

    # Log do subsistema IKE com timestamp de MICROSSEGUNDO, para
    # correlacionar evento de rekey/reauth com pico de latência e com os
    # eventos do `ip xfrm monitor` (ver
    # evaluation/collectors/xfrm_monitor.py). Sem `time_precision` o
    # timestamp tem resolução de SEGUNDO, inútil para um evento que a
    # Fase A mediu em ~1,8 ms.
    #
    # **O caminho /run não é acidental.** Cada instância do charon roda
    # num mount namespace próprio com `/run` bind-montado de
    # `/run/ipsec-<netns>` (ver lab/ipsec/start-ipsec-side.sh), então
    # este mesmo caminho resolve para um arquivo DIFERENTE em cada lado
    # do túnel: /run/ipsec-cu-ns/charon-ike.log e
    # /run/ipsec-5gc-edge-ns/charon-ike.log no hospedeiro. Um caminho
    # fora de /run faria os dois charons escreverem no mesmo arquivo,
    # intercalando as linhas dos dois lados sem como separar.
    #
    # Duas armadilhas no caminho, as duas custaram tempo:
    #
    # 1. O nome da seção é `sapq` e o arquivo vem de `path`. O nome só
    #    aceita caracteres válidos em nome de seção, então um caminho com
    #    `/` como nome NÃO funciona — tentar isso impediu o charon de
    #    subir, sem mensagem útil.
    # 2. O nome do ARQUIVO tem de ser `charon.<algo>`, com PONTO. O
    #    perfil AppArmor do charon (/etc/apparmor.d/usr.lib.ipsec.charon)
    #    permite escrita só em `/run/charon.* rw`, e `charon-ike.log`
    #    (hífen) não casa com esse glob: o charon sobe normalmente, não
    #    reclama, e simplesmente não cria o log. O sintoma só aparece no
    #    journal, como
    #    `apparmor="DENIED" operation="mknod" ... denied_mask="c"`.
    #    Renomear para `charon.ike.log` resolve sem mexer na política de
    #    segurança do hospedeiro, que é preferível a afrouxá-la.
    filelog {
        sapq {
            path = /run/charon.ike.log
            time_format = %Y-%m-%dT%H:%M:%S
            # `ms` ou `us`. Não existe `time_add_ms` neste strongSwan.
            time_precision = us
            # Só o subsistema IKE: `default = 0` evita que o log de
            # rede/kernel/enc afogue o sinal, como o `replay update`
            # faz no xfrm monitor.
            default = 0
            ike = 2
            append = yes
            # Sem isto as linhas ficam no buffer e o timestamp de
            # escrita deixa de servir para correlação.
            flush_line = yes
        }
    }
}
