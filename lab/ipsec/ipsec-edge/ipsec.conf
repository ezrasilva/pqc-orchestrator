# Config do lado 5gc-edge-ns — responder passivo do enlace N2/N3. Nunca
# inicia nem rotaciona sozinho (auto=add, não auto=start); só aceita a
# conexão que o cu-ns (o initiator, onde roda o IPsec Agent) estabelecer ou
# rotacionar. Ver ~/ARQUITETURA-ORQUESTRADOR.md.

config setup
    charondebug="ike 1, knl 1, cfg 1"

conn n2n3-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=10.98.0.98/32,172.18.0.99/32
    right=10.97.0.2
    rightsubnet=10.98.0.0/24,172.18.0.0/16
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=add
