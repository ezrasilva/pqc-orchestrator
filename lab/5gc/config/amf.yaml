# AMF — as 3 fatias declaradas seguem o mesmo esquema da Tabela 3 do artigo do
# Murilo: eMBB=SST 1, URLLC=SST 2, mIoT=SST 3, todas com SD ffffff.

amf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      nrf:
        - uri: http://nrf:7777

  ngap:
    server:
      - dev: eth1   # interface N2 (core-net), ouvindo a conexão do gNB

  metrics:
    server:
      - dev: eth0
        port: 9090

  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1

  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 1

  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1   # eMBB
          sd: ffffff
        - sst: 2   # URLLC
          sd: ffffff
        - sst: 3   # mIoT
          sd: ffffff

  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA1, NEA2]

  network_name:
    full: Open5GS-Lab

  amf_name: open5gs-amf0

  time:
    t3512:
      value: 540
