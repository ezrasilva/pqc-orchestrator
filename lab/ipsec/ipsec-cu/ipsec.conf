# Config do lado CU (netns cu-ns) — o único lado que INICIA e comanda
# rotação (auto=start nas conexões de controle). É aqui que o IPsec Agent
# do orquestrador roda, falando VICI com este charon local.
#
# Ver ~/ARQUITETURA-ORQUESTRADOR.md, ~/ARQUITETURA-PROTOTIPO-COMPLETA.md
# (seção 5, Fase 3) e ~/RUNBOOK-OAI.md pro resto do contexto.

config setup
    charondebug="ike 1, knl 1, cfg 1"

# Enlace F1 (CU <-> DU), transport mode — mesmo netns, mesma sub-rede,
# sem NAT no meio. Não muda nesta fase.
conn f1-cu-du
    type=transport
    authby=psk
    left=10.99.0.1
    right=10.99.0.2
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start

# Enlace N2 (NGAP, controle) — único perfil, não diferenciado por fatia
# (tráfego de controle não carrega dado de usuário). Substitui a antiga
# n2n3-cu-edge combinada (ver ARQUITETURA-PROTOTIPO-COMPLETA.md seção 5.0).
conn n2-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=10.98.0.98/32
    right=10.97.0.2
    rightsubnet=10.98.0.0/24
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start

# Enlace N3 (GTP-U, dado de usuário) — Fase 4: as três conexões
# (n3-urllc/embb/miot-cu-edge) NÃO estão mais aqui. Dois motivos, ambos
# confirmados empiricamente (ver ARQUITETURA-PROTOTIPO-COMPLETA.md seção
# 5.3):
# 1. PPK (RFC 8784, simula QKD) não existe no parser clássico do
#    ipsec.conf — confirmado em src/starter/keywords.txt do strongSwan,
#    zero menção a "ppk".
# 2. Mais importante: quando múltiplos conns compartilham o mesmo par de
#    endereços externos (left/right), o strongSwan pode fazer DOWNGRADE
#    SILENCIOSO pro perfil mais fraco durante o IKE_SA_INIT (reproduzido
#    num ambiente isolado) — então as três N3 precisam de endereço
#    externo próprio, o que também exige sair do modelo
#    stroke/ipsec.conf (onde conns ao mesmo peer tendem a se misturar)
#    pro modelo vici/swanctl (connections{} nomeadas, sem essa ambiguidade
#    de seleção por endereço). Config em
#    ~/oai-lab-conf/swanctl-cu/swanctl.conf, carregada no mesmo charon
#    via `swanctl --load-all`.
