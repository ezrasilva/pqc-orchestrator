# Config do lado CU (netns cu-ns) — o único lado que INICIA e comanda
# rotação (auto=start nas conexões de controle). É aqui que o IPsec Agent
# do orquestrador roda, falando VICI com este charon local.
#
# Ver ~/ARQUITETURA-ORQUESTRADOR.md, ~/ARQUITETURA-PROTOTIPO-COMPLETA.md
# (seção 5, Fase 3) e ~/RUNBOOK-OAI.md pro resto do contexto.

config setup
    charondebug="ike 1, knl 1, cfg 1"

# Enlace F1 (CU <-> DU), transport mode — mesmo netns, mesma sub-rede,
# sem NAT no meio. Não muda nesta fase.
conn f1-cu-du
    type=transport
    authby=psk
    left=10.99.0.1
    right=10.99.0.2
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start

# Enlace N2 (NGAP, controle) — único perfil, não diferenciado por fatia
# (tráfego de controle não carrega dado de usuário). Substitui a antiga
# n2n3-cu-edge combinada (ver ARQUITETURA-PROTOTIPO-COMPLETA.md seção 5.0).
conn n2-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=10.98.0.98/32
    right=10.97.0.2
    rightsubnet=10.98.0.0/24
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start

# Enlace N3 (GTP-U, dado de usuário) — Fase 3: três SAs separadas só por
# mark, cifra fixa (sem PQC ainda, isso é Fase 4 — ver seção 5.3). O
# Agente de Segurança (ainda não automatizado nesta fase) traria isso com
# auto=add + "ipsec up" sob demanda; por ora sobem junto com o resto pra
# validar a seleção por mark.
conn n3-urllc-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=172.18.0.99/32
    right=10.97.0.2
    rightsubnet=172.18.0.0/16
    mark_out=0x10
    mark_in=0x10
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=add

conn n3-embb-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=172.18.0.99/32
    right=10.97.0.2
    rightsubnet=172.18.0.0/16
    mark_out=0x20
    mark_in=0x20
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=add

conn n3-miot-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=172.18.0.99/32
    right=10.97.0.2
    rightsubnet=172.18.0.0/16
    mark_out=0x30
    mark_in=0x30
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=add
