# Config do lado CU (netns cu-ns) — o único lado que INICIA e comanda
# rotação (auto=start nas duas conexões). É aqui que o IPsec Agent do
# orquestrador roda, falando VICI com este charon local.
#
# Ver ~/ARQUITETURA-ORQUESTRADOR.md e ~/RUNBOOK-OAI.md pro resto do
# contexto (por que dois enlaces, por que essa topologia de N2/N3).

config setup
    charondebug="ike 1, knl 1, cfg 1"

# Enlace F1 (CU <-> DU), transport mode — mesmo netns, mesma sub-rede,
# sem NAT no meio.
conn f1-cu-du
    type=transport
    authby=psk
    left=10.99.0.1
    right=10.99.0.2
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start

# Enlace N2/N3 (CU <-> borda do 5GC), tunnel mode — termina no 5gc-edge-ns,
# que decripta e encaminha pro AMF/UPF de verdade sem NAT. leftsubnet cobre
# os dois endereços que a CU usa nesse enlace: o alias N2 (AMF) e o alias
# N3 (UPF), ambos roteados por proxy-ARP através do 5gc-edge-ns.
conn n2n3-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=10.98.0.98/32,172.18.0.99/32
    right=10.97.0.2
    rightsubnet=10.98.0.0/24,172.18.0.0/16
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=start
