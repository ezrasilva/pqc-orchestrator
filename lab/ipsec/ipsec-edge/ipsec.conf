# Config do lado 5gc-edge-ns — responder passivo de todos os enlaces N2/N3
# (auto=add, não auto=start; nunca inicia nem rotaciona sozinho). Ver
# ~/ARQUITETURA-ORQUESTRADOR.md e ~/ARQUITETURA-PROTOTIPO-COMPLETA.md
# (seção 5, Fase 3).

config setup
    charondebug="ike 1, knl 1, cfg 1"

conn n2-cu-edge
    type=tunnel
    authby=psk
    left=10.97.0.1
    leftsubnet=10.98.0.98/32
    right=10.97.0.2
    rightsubnet=10.98.0.0/24
    ike=aes256-sha256-modp2048
    esp=aes256-sha256
    auto=add

# As três conexões N3 (urllc/embb/miot) não estão mais aqui — precisam
# de endereço externo próprio (evita downgrade silencioso de proposta
# quando múltiplos conns compartilham left/right, achado confirmado
# nesta VM) e PPK (urllc) não existe no parser clássico. Config em
# ~/oai-lab-conf/swanctl-edge/swanctl.conf, carregada via
# `swanctl --load-all`. Ver ARQUITETURA-PROTOTIPO-COMPLETA.md seção 5.3.
